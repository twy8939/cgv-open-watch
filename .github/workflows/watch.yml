name: CGV booking watch

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      notify_existing:
        description: "현재 열린 회차도 알릴지 선택"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cgv-open-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: CGV 일정 확인
        run: |
          extra=""
          if [ "${{ inputs.notify_existing }}" = "true" ]; then
            extra="--notify-existing"
          fi
          npm run check -- --scan-only $extra

      - name: 신규 회차와 알림 대기열 저장
        id: save_new
        run: |
          if git diff --quiet -- state/notifications.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/notifications.json
          git commit -m "chore: CGV 알림 상태 갱신"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Discord 알림 전송
        id: notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run check -- --send-pending

      - name: 전송 완료 상태 저장
        if: always() && steps.save_new.outcome == 'success'
        run: |
          if git diff --quiet -- state/notifications.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/notifications.json
          git commit -m "chore: CGV 알림 전송 상태 갱신"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
