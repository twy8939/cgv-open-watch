name: CGV booking watch

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      notify_existing:
        description: "현재 열린 회차도 알릴지 선택"
        required: false
        default: false
        type: boolean
      send_test_notification:
        description: "실제 오픈 알림과 구분된 Discord 테스트 메시지 전송"
        required: false
        default: false
        type: boolean
      trigger_source:
        description: "외부 호출 출처"
        required: false
        default: "manual"
        type: string
      scheduled_time_ms:
        description: "외부 스케줄러 예약 시각(Unix ms)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: cgv-open-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Discord 연결 테스트
        if: inputs.send_test_notification == true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CGV_WATCH_REPORT: ${{ runner.temp }}/cgv-watch-report.json
        run: npm run check -- --test-discord

      - name: CGV 일정 확인
        env:
          CGV_WATCH_REPORT: ${{ runner.temp }}/cgv-watch-report.json
        run: |
          extra=""
          if [ "${{ inputs.notify_existing }}" = "true" ]; then
            extra="--notify-existing"
          fi
          npm run check -- --scan-only $extra

      - name: 신규 회차와 알림 대기열 저장
        id: save_new
        run: |
          if git diff --quiet -- state/notifications.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/notifications.json
          git commit -m "chore: CGV 알림 상태 갱신"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Discord 알림 전송
        id: notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CGV_WATCH_REPORT: ${{ runner.temp }}/cgv-watch-report.json
        run: npm run check -- --send-pending

      - name: 전송 완료 상태 저장
        if: always() && steps.save_new.outcome == 'success'
        run: |
          if git diff --quiet -- state/notifications.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/notifications.json
          git commit -m "chore: CGV 알림 전송 상태 갱신"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 실행 결과 요약
        if: always()
        env:
          CGV_WATCH_REPORT: ${{ runner.temp }}/cgv-watch-report.json
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          TRIGGER_SCHEDULED_TIME_MS: ${{ inputs.scheduled_time_ms }}
        run: node src/summary.js >> "$GITHUB_STEP_SUMMARY"
